<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>shuǐguǒ 水果</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">

  <!-- Arcade SDK — root-relative EVERGREEN alias (/arcade-sdk.js): the fleet
       posture (#120/#108) is that every app follows the alias and a breaking
       major ships as one coordinated migration, not per-app pins. -->
  <script src="/arcade-sdk.js"></script>
  <script>Arcade.init({ gameId: 'shuiguo' });</script>

  <!-- Optional element library + this game's sound pack. The pack IS the
       sound: with either missing, js/sfx.js registers nothing and the game
       plays silence by design (no chiptune fallback — fleet-wide decision). -->
  <script src="/arcade-audio.js"></script>
  <script src="js/soundpack.js"></script>
</head>
<body>
  <div class="frame">
    <header id="hud" hidden>
      <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
      <div class="next-box" aria-label="Next fruit">
        <span class="label">Next</span>
        <canvas id="next" width="48" height="48"></canvas>
        <span id="next-label" class="next-name"></span>
      </div>
      <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
    </header>

    <!-- The board and everything that floats over it WITHOUT pausing it: the
         chain banner and the discovery cards. Both are inert to pointers
         except the card itself (tap to dismiss), so play never stops. The
         sheets below are later siblings and cover this whole stage. -->
    <div class="stage">
      <canvas id="board" tabindex="0" aria-label="Fruit drop board — arrow keys aim, space drops"></canvas>
      <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
      <div id="cards" class="cards" aria-live="polite"></div>
    </div>

    <section id="menu" class="sheet">
      <h1 class="sign"><span class="sign-hanzi">水果</span><span class="sign-name">shuǐguǒ</span></h1>
      <p class="tagline">Drop fruit. Match pairs. Grow the watermelon 西瓜.</p>
      <div id="chart" class="chart" aria-label="Fruit evolution chain"></div>
      <button id="play" class="big" type="button">Play 玩</button>
      <p class="hint">Slide to aim · release to drop · two of a kind merge into the next fruit · don't cross the line</p>
    </section>

    <section id="over" class="sheet" hidden>
      <h2>The stall is full! 满了!</h2>
      <p class="final">Score <strong id="final-score">0</strong></p>
      <p id="new-best" class="new-best" hidden>New best! 新纪录!</p>

      <!-- The run in one glance: what you grew, and what it took. Filled from
           g.tally by main.js; rows that stayed at zero are left out. -->
      <div class="summary">
        <figure class="biggest">
          <canvas id="over-fruit" class="biggest-art" role="img"></canvas>
          <figcaption>
            <span class="label">Biggest fruit</span>
            <span class="biggest-name">
              <b id="over-fruit-hanzi"></b> <i id="over-fruit-pinyin"></i>
            </span>
          </figcaption>
        </figure>
        <dl id="over-stats" class="stat-grid"></dl>
      </div>

      <button id="again" class="big" type="button">Again 再来</button>
      <button id="to-menu" type="button">Menu</button>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>

  <!-- Own service worker for standalone offline play. Loopback-guarded so
       local dev is never masked by stale cache; fire-and-forget. -->
  <script>
    if ('serviceWorker' in navigator &&
        !/^(127\.|localhost$|0\.0\.0\.0$|::1$)/.test(location.hostname)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: '/shuiguo/' })
          .catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
